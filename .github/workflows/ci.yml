name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-qdii.lock
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m venv .venv && .venv/bin/python -m pip install -r python/requirements-qdii.lock
      - run: npm ci
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium
      - name: Offline Linux runtime acceptance
        run: |
          export TRANSLATION_BROWSER_EXECUTABLE=$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")
          npm run check:runtime-offline
      - run: npm run check:backup-restore
      - run: npm run check
