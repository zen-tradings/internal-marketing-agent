<meta charset="utf-8">
<style>
  /* Zen Trading white cover · 16:9 · 1280×720 */
  :root{
    --paper:#f7f8f9;
    --paper-deep:#f0f3f5;
    --ink:#294a63;
    --muted:#62798a;
    --pearl:#e5ebef;
    --haze:#d6e0e7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px}
  body{
    position:relative;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wash{position:absolute;inset:0;background:
    radial-gradient(80% 100% at 8% 50%,rgba(255,255,255,.94) 0%,rgba(255,255,255,.42) 54%,transparent 78%),
    linear-gradient(118deg,#fbfbfc 0%,#f5f7f8 62%,#eef2f4 100%)}
  .orbit{position:absolute;right:-92px;top:78px;width:560px;height:560px;border-radius:50%;
    background:
      radial-gradient(circle at 38% 35%,rgba(255,255,255,.98) 0 24%,rgba(242,246,248,.9) 51%,rgba(218,228,235,.58) 72%,rgba(255,255,255,0) 73%),
      repeating-radial-gradient(circle at 48% 52%,rgba(41,74,99,.07) 0 1px,transparent 1px 7px);
    opacity:.72;filter:blur(.15px)}
  .orbit:before{content:"";position:absolute;inset:76px;border-radius:50%;border:1px solid rgba(41,74,99,.09)}
  .dots{position:absolute;right:-20px;bottom:-22px;width:510px;height:330px;opacity:.25;
    background-image:radial-gradient(circle,rgba(41,74,99,.26) 0 1.2px,transparent 1.4px);
    background-size:8px 8px;
    -webkit-mask-image:linear-gradient(128deg,transparent 4%,#000 80%);mask-image:linear-gradient(128deg,transparent 4%,#000 80%)}

  .brand{position:absolute;left:68px;top:38px;color:var(--ink)}
  .monogram{height:27px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;
    font-size:26px;line-height:25px;letter-spacing:-.2em;transform:skewX(-12deg);transform-origin:left center}
  .brand-name{margin-top:5px;font-size:16px;line-height:1;letter-spacing:.055em;font-weight:450;text-transform:uppercase}

  .main{position:absolute;left:80px;right:80px;top:240px;text-align:center}
  h1{max-width:1090px;margin:0 auto;font-size:76px;line-height:1.12;letter-spacing:.015em;font-weight:720;color:var(--ink)}
  .subtitle{max-width:960px;margin:27px auto 0;font-family:Georgia,"Songti SC","STSong",serif;
    font-size:29px;line-height:1.3;letter-spacing:.01em;font-weight:700;color:var(--ink)}
  .subtitle:empty{display:none}

  .site{position:absolute;left:68px;bottom:47px;font-size:19px;letter-spacing:.045em;color:var(--ink);font-weight:500}
  .edition{position:absolute;right:68px;bottom:49px;font-size:13px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
</style>

<div class="wash"></div>
<div class="orbit"></div>
<div class="dots"></div>

<div class="brand">
  <div class="monogram">ZT</div>
  <div class="brand-name">Zen Trading</div>
</div>

<main class="main">
  <h1 id="title"></h1>
  <div class="subtitle" id="subtitle"></div>
</main>

<div class="site">zentradings.com</div>
<div class="edition">Zen Research</div>

<script>
  const DATA = window.DATA || {
    title:"长鑫科技",
    key_takeaway:"Innovating Memory. Powering Intelligence."
  };
  const title = String(DATA.title || '').trim();
  const subtitle = String(DATA.key_takeaway || 'Zen Research from Zen Trading').trim();
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  titleEl.textContent = title;
  subtitleEl.textContent = subtitle;

  // 长标题保持单一视觉层级，按字数自适应，不引入旧版信息卡片。
  const length = [...title].length;
  if (length > 28) titleEl.style.fontSize = '48px';
  else if (length > 20) titleEl.style.fontSize = '56px';
  else if (length > 13) titleEl.style.fontSize = '64px';
  const subtitleLength = [...subtitle].length;
  if (subtitleLength > 38) subtitleEl.style.fontSize = '21px';
  else if (subtitleLength > 28) subtitleEl.style.fontSize = '24px';
</script>
